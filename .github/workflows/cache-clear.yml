name: "Cleanup caches by a branch"

on: # yamllint disable-line rule:truthy
    pull_request:
        types:
            - "closed"

permissions:
    actions: "write" # to delete caches for the merged branch
    contents: "read" # to read the repository

jobs:
    cleanup-branch-cache:
        uses: "anolilab/workflows/.github/workflows/cleanup-branch-cache.yaml@b5d611c5dda8645e93f2407e3d3fee250a9f5376" # v24.1.0 # main
        with:
            target-repo: "anolilab/javascript-style-guide"
