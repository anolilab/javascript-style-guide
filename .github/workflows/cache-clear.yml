name: "Cleanup caches by a branch"

on: # yamllint disable-line rule:truthy
    pull_request:
        types:
            - "closed"

permissions:
    actions: "write" # to delete caches for the merged branch
    contents: "read" # to read the repository

jobs:
    cleanup-branch-cache:
        uses: "anolilab/workflows/.github/workflows/cleanup-branch-cache.yaml@c69dbdcdfb274e317a1ca7a17b3457b19cbae527" # v24.2.2 # main
        with:
            target-repo: "anolilab/javascript-style-guide"
