name: "Cleanup caches by a branch"

on: # yamllint disable-line rule:truthy
    pull_request:
        types:
            - "closed"

permissions:
    actions: "write" # to delete caches for the merged branch
    contents: "read" # to read the repository

jobs:
    cleanup-branch-cache:
        uses: "anolilab/workflows/.github/workflows/cleanup-branch-cache.yaml@52ac50a94d1eb79f1f13a11d595a585ead491cc2" # v23.0.7 # main
        with:
            target-repo: "anolilab/javascript-style-guide"
