name: "Cleanup caches by a branch"

on: # yamllint disable-line rule:truthy
    pull_request:
        types:
            - "closed"

permissions:
    actions: "write" # to delete caches for the merged branch
    contents: "read" # to read the repository

jobs:
    cleanup-branch-cache:
        uses: "anolilab/workflows/.github/workflows/cleanup-branch-cache.yaml@fb7a881926480723026a1deaa587ceaaaee7bf12" # v24.2.0 # main
        with:
            target-repo: "anolilab/javascript-style-guide"
