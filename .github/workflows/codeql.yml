name: "CodeQL"
on: # yamllint disable-line rule:truthy
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
    schedule:
        - cron: "0 0 * * 1"
permissions: {}
jobs:
    codeql:
        permissions:
            security-events: "write"
            actions: "read"
            contents: "read"
        uses: "anolilab/workflows/.github/workflows/codeql.yml@e0bf8c3215311c2f9f74daceea7c292e4dc520d7" # v26.0.5
        with:
            languages: '["javascript-typescript"]'
            branches: '["main"]'
