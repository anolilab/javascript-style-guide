name: "Tests"
on: # yamllint disable-line rule:truthy
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
permissions: {}
jobs:
    test:
        permissions:
            contents: "read"
        uses: "anolilab/workflows/.github/workflows/test.yml@52ac50a94d1eb79f1f13a11d595a585ead491cc2" # v23.0.7
        with:
            node_versions: '["22", "24"]'
            os_matrix: '["ubuntu-latest"]'
            extra_includes: '[{"os": "macos-latest", "node": "22"}]'
            test_command: "pnpm build:packages && pnpm test:all"
            coverage: false
