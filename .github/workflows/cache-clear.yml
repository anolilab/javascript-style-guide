name: "Cleanup caches by a branch"

on: # yamllint disable-line rule:truthy
    pull_request:
        types:
            - "closed"

permissions:
    actions: "write" # to delete caches for the merged branch
    contents: "read" # to read the repository

jobs:
    cleanup-branch-cache:
        uses: "anolilab/workflows/.github/workflows/cleanup-branch-cache.yaml@e0bf8c3215311c2f9f74daceea7c292e4dc520d7" # v26.0.5 # main
        with:
            target-repo: "anolilab/javascript-style-guide"
