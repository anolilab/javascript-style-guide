name: "CodeQL"
on: # yamllint disable-line rule:truthy
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
    schedule:
        - cron: "0 0 * * 1"
permissions: {}
jobs:
    codeql:
        permissions:
            security-events: "write"
            actions: "read"
            contents: "read"
        uses: "anolilab/workflows/.github/workflows/codeql.yml@c69dbdcdfb274e317a1ca7a17b3457b19cbae527" # v24.2.2
        with:
            languages: '["javascript-typescript"]'
            branches: '["main"]'
