name: "AlloAllo"

on: # yamllint disable-line rule:truthy
    issues:
        types:
            - "opened"
    pull_request_target:
        branches:
            - "main"
        types:
            - "opened"
            - "closed"

permissions:
    contents: "read" # to read the repository
    issues: "write" # for the shared workflow to comment on and label issues
    pull-requests: "write" # for the shared workflow to comment on and label pull requests

jobs:
    allo-allo:
        uses: "anolilab/workflows/.github/workflows/allo-allo.yml@52ac50a94d1eb79f1f13a11d595a585ead491cc2" # v23.0.7 # main
        with:
            target-repo: "anolilab/javascript-style-guide"
