name: "Lint"
on: # yamllint disable-line rule:truthy
    pull_request:
        branches: ["main"]
permissions: {}
jobs:
    lint:
        permissions:
            contents: "read"
            pull-requests: "read"
        uses: "anolilab/workflows/.github/workflows/lint.yml@b5d611c5dda8645e93f2407e3d3fee250a9f5376" # v24.1.0
        with:
            lint_eslint: true
            lint_types: true
            lint_attw: false
            lint_package_json: true
            lint_markdown: false
            lint_yaml: true
            lint_actionlint: true
            lint_rust: false
            node_version: "22"
