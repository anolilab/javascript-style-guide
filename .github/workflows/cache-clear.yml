name: "Cleanup caches by a branch"

on: # yamllint disable-line rule:truthy
    pull_request:
        types:
            - "closed"

permissions:
    actions: "write" # to delete caches for the merged branch
    contents: "read" # to read the repository

jobs:
    cleanup-branch-cache:
        uses: "anolilab/workflows/.github/workflows/cleanup-branch-cache.yaml@986f549679af57daf7997679e2a6ffce5dbb4d6b" # v25.0.1 # main
        with:
            target-repo: "anolilab/javascript-style-guide"
