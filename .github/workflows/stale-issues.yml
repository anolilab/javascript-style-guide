name: "Label Idle Issues"

on: # yamllint disable-line rule:truthy
    schedule:
        - cron: "0 0 * * *"

permissions:
    contents: "read" # to read the repository
    issues: "write" # for the shared workflow to comment on and label issues
    pull-requests: "write" # for the shared workflow to comment on and label pull requests

jobs:
    stale-issues:
        uses: "anolilab/workflows/.github/workflows/stale-issues.yml@fb7a881926480723026a1deaa587ceaaaee7bf12" # v24.2.0 # main
        with:
            target-repo: "anolilab/javascript-style-guide"
