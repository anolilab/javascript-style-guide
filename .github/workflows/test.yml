name: "Tests"
on: # yamllint disable-line rule:truthy
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
permissions: {}
jobs:
    test:
        permissions:
            contents: "read"
        uses: "anolilab/workflows/.github/workflows/test.yml@e0bf8c3215311c2f9f74daceea7c292e4dc520d7" # v26.0.5
        with:
            node_versions: '["22", "24"]'
            os_matrix: '["ubuntu-latest"]'
            extra_includes: '[{"os": "macos-latest", "node": "22"}]'
            test_command: "pnpm build:packages && pnpm test:all"
            coverage: false
