name: "Tests"
on: # yamllint disable-line rule:truthy
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
permissions: {}
jobs:
    test:
        permissions:
            contents: "read"
        uses: "anolilab/workflows/.github/workflows/test.yml@b5d611c5dda8645e93f2407e3d3fee250a9f5376" # v24.1.0
        with:
            node_versions: '["22", "24"]'
            os_matrix: '["ubuntu-latest"]'
            extra_includes: '[{"os": "macos-latest", "node": "22"}]'
            test_command: "pnpm build:packages && pnpm test:all"
            coverage: false
